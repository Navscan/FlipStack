<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPvpn Enterprise Portal - FlipStack</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');
    
    :root {
      --bg: #0d0d12;
      --panel: #1a1a22;
      --text: #ffffff;
      --gold: #D4AF37;
      --teal: #00C9A7;
      --pink: #FF3399;
      --danger: #ff4545;
      --success: #4ade80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100dvh; padding: 1rem; }
    
    .ci-logo { display: inline-block; text-decoration: none; transform: skewX(-10deg); text-align: center; margin-bottom: 2rem; }
    .ci-logo span { font-family: 'Orbitron', sans-serif !important; font-weight: 900 !important; font-size: 2rem; letter-spacing: -0.02em; }
    .ci-flip { color: var(--pink); }
    .ci-stack { color: var(--teal); }
    
    .glass-panel { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(16px); border: 1px solid rgba(212, 175, 55, 0.35); border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(212, 175, 55, 0.03); }
    
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; text-align: center; color: var(--gold); }
    p.subtitle { text-align: center; color: #aaa; font-size: 0.9rem; margin-bottom: 2rem; }
    
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; font-size: 0.85rem; margin-bottom: 0.5rem; color: #aaa; font-weight: 500; }
    input { width: 100%; padding: 0.85rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); color: white; outline: none; font-size: 0.95rem; transition: border-color 0.2s; }
    input:focus { border-color: var(--gold); }
    
    .btn-primary { width: 100%; background: linear-gradient(#D4AF37, #b8952b); color: #000; border: none; padding: 0.85rem; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.95rem; transition: opacity 0.2s; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .alert { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem; display: none; text-align: center; }
    .alert-error { background: rgba(255,69,69,0.1); border: 1px solid var(--danger); color: var(--danger); }
    .alert-success { background: rgba(74,222,128,0.1); border: 1px solid var(--success); color: var(--success); }
    
    .hidden { display: none !important; }
    
    /* Deep link button style */
    .btn-deeplink { display: block; text-align: center; background: rgba(0, 201, 167, 0.1); border: 2px solid var(--teal); color: var(--teal); text-decoration: none; padding: 1rem; border-radius: 10px; font-weight: bold; font-size: 1.1rem; margin-top: 1.5rem; transition: background 0.2s; }
    .btn-deeplink:hover { background: rgba(0, 201, 167, 0.2); }
    
    .back-link { display: block; text-align: center; margin-top: 1.5rem; color: #888; text-decoration: none; font-size: 0.85rem; }
    .back-link:hover { color: white; }
  </style>
</head>
<body>

  <div>
    <a href="/" class="ci-logo">
      <span class="ci-flip">Flip</span><span class="ci-stack">Stack</span>
    </a>

    <div class="glass-panel">
      <!-- LOGIN VIEW -->
      <div id="loginView">
        <h1>CPvpn Enterprise</h1>
        <p class="subtitle">Log in with your CPvpn app credentials</p>
        
        <div id="loginAlert" class="alert alert-error"></div>
        
        <form id="loginForm">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
          </div>
          <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
        </form>
      </div>

      <!-- DASHBOARD VIEW -->
      <div id="dashboardView" class="hidden">
        <h1>Enterprise Portal</h1>
        <p class="subtitle">Welcome, <span id="userEmail" style="color:white; font-weight:bold;"></span></p>
        
        <div id="dashAlert" class="alert"></div>

        <form id="voucherForm">
          <div class="form-group">
            <label>Redeem Voucher Code</label>
            <input type="text" id="voucherCode" required placeholder="XXXX-XXXX-XXXX-XXXX" style="font-family: monospace; text-transform: uppercase;">
          </div>
          <button type="submit" class="btn-primary" id="redeemBtn">Redeem Voucher</button>
        </form>

        <div id="successView" class="hidden" style="text-align: center; margin-top: 2rem;">
          <p style="color: var(--success); font-weight: bold; margin-bottom: 1rem;">Voucher Applied Successfully!</p>
          <p style="font-size: 0.85rem; color: #aaa; margin-bottom: 1rem;">Tap below on your phone to launch the app and connect.</p>
          <a href="#" id="deeplink" class="btn-deeplink">Open CPvpn App →</a>
        </div>
        
        <button onclick="logout()" style="background: none; border: none; color: #888; font-size: 0.85rem; margin-top: 2rem; cursor: pointer; width: 100%; text-decoration: underline;">Log out</button>
      </div>
    </div>

    <a href="/" class="back-link">← Back to FlipStack</a>
  </div>

  <script>
    const API_BASE = 'https://api.flipstack.store/cpvpn';
    let currentToken = null;

    // Check if already logged in
    window.onload = () => {
      const savedToken = localStorage.getItem('cpvpn_ent_token');
      const savedEmail = localStorage.getItem('cpvpn_ent_email');
      if (savedToken && savedEmail) {
        currentToken = savedToken;
        showDashboard(savedEmail);
      }
    };

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const alert = document.getElementById('loginAlert');
      btn.disabled = true; btn.innerText = 'Signing in...'; alert.style.display = 'none';

      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        currentToken = data.token;
        localStorage.setItem('cpvpn_ent_token', currentToken);
        localStorage.setItem('cpvpn_ent_email', document.getElementById('email').value);
        
        showDashboard(document.getElementById('email').value);
      } catch (err) {
        alert.innerText = err.message;
        alert.style.display = 'block';
        btn.disabled = false; btn.innerText = 'Sign In';
      }
    });

    document.getElementById('voucherForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('redeemBtn');
      const alert = document.getElementById('dashAlert');
      const code = document.getElementById('voucherCode').value;
      btn.disabled = true; btn.innerText = 'Redeeming...'; alert.style.display = 'none';

      try {
        const res = await fetch(`${API_BASE}/api/voucher/redeem`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentToken}`
          },
          body: JSON.stringify({ code: code })
        });
        
        const data = await res.json();
        if (!res.ok) throw new Error(data.error.replace(/_/g, ' ').toUpperCase());
        
        // Success
        document.getElementById('voucherForm').classList.add('hidden');
        document.getElementById('successView').classList.remove('hidden');
        
        // Generate deep link to open app
        document.getElementById('deeplink').href = `cpvpn://activate?code=${code}`;
        
      } catch (err) {
        alert.innerText = err.message;
        alert.className = 'alert alert-error';
        alert.style.display = 'block';
        btn.disabled = false; btn.innerText = 'Redeem Voucher';
      }
    });

    function showDashboard(email) {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('dashboardView').classList.remove('hidden');
      document.getElementById('userEmail').innerText = email;
    }

    function logout() {
      localStorage.removeItem('cpvpn_ent_token');
      localStorage.removeItem('cpvpn_ent_email');
      window.location.reload();
    }
  </script>
</body>
</html>
